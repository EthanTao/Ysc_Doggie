# Doggie 恢复运控参数（唯一参数源）
# 说明：
#   1. 下列阈值均为待标定初值，最终值以 data/calibration/thresholds.md 为准。
#   2. 代码中禁止散落魔法数字；实验记录配置哈希，保证可复现。
#   3. 角度单位为度，时间单位为秒，角速度单位为 rad/s。

meta:
  version: "0.1.0"
  updated: "2026-11-19"
  robot: "DeepRobotics Lite3 (no LiDAR)"

detector:
  rate_hz: 200                   # 决策层采样率（Supervisor 按此调度，须整除 1/timestep）
  lowpass_cutoff_hz: 10.0

  # 主判据：姿态角门限
  roll_threshold_deg: 50.0
  pitch_threshold_deg: 50.0

  # 快速通道：大倾角短驻留，保证时延 <= 2 s
  fast_path_deg: 75.0
  fast_path_dwell_s: 0.15
  # 高速翻转通道：姿态已越限且机体角速度超过阈值，短驻留即确认。
  # 完整 360° 翻转可能在 0.3 s 内扫过 75°，只靠倾角驻留会漏掉高速段。
  rate_fast_path_rad_s: 5.0
  rate_fast_dwell_s: 0.05

  # 持续确认：抑制腾空/急转瞬间误报
  dwell_s: 0.30

  # 回差：起身过程中姿态在阈值附近抖动时不重复触发
  recover_roll_deg: 35.0
  recover_pitch_deg: 35.0
  recover_dwell_s: 0.50

  # 辅助判据（趴地/仰翻时姿态角≈0，必须靠高度；LieDown 高度 0.12 在门限之上）
  height_min_m: 0.10
  height_dwell_s: 0.30
  # 事件起点复位高度：必须明显高于趴地门限，避免全翻落地后 h≈0.10 徘徊时
  # 过早清掉起始姿态，导致侧翻被分类成 flat。
  stable_height_m: 0.12
  use_height: true
  # 以下为实机滤波预留项，当前 FallDetector 不读取（仿真用 height 兜底已足够）；
  # 接入 ROS2 后由后端滤波/NaN 保护使用。
  use_contact: true
  contact_min_feet: 1
  quiet_omega_rad_s: 1.5
  nan_timeout_s: 0.20

  # 翻倒类型分类（仅用于记录/策略，不参与是否摔倒的判定）
  fall_type_pitch_deg: 60.0
  fall_type_roll_deg: 60.0

# 测试/恢复 profile：同一 profile 同时决定仿真注入强度与 FSM 参数。
# 实机不使用 injections（真机不会主动制造摔倒），只读取 fsm 覆盖项。
profiles:
  nominal:
    description: "常规翻倒：前/后/侧注入 65–90°，落地后进入官方恢复流程"
    fsm:
      settle_max_s: 3.0
    injections:
      # 绕 +y 旋转 +90° = 前倾/鼻尖向下；绕 -y = 后仰。
      front:      {axis: [0.0, 1.0, 0.0], deg: 90.0,  rate: [0.0, 0.0, 0.0], clearance_m: 0.005}
      back:       {axis: [0.0, 1.0, 0.0], deg: -90.0, rate: [0.0, 4.0, 0.0], clearance_m: 0.005}
      side_left:  {axis: [1.0, 0.0, 0.0], deg: 65.0,  rate: [0.0, 0.0, 0.0], clearance_m: 0.005}
      side_right: {axis: [1.0, 0.0, 0.0], deg: -65.0, rate: [0.0, 0.0, 0.0], clearance_m: 0.005}
      prone:      {axis: [1.0, 0.0, 0.0], deg: 0.0,   rate: [0.0, 0.0, 0.0], clearance_m: 0.005}

  full_flip:
    description: "完全翻过去：带初始角速度/离地高度完成 360° 翻转，落地仍回到趴地后再起身"
    fsm:
      # 全翻能量大、落地弹跳多，静置窗口比常规翻倒更长，避免在滚动中误评估。
      settle_max_s: 5.0
    injections:
      # 起始姿态已越过 90°，剩余翻转 >250°；落地必须回到趴地（俯卧），
      # 纯仰面静止姿态仍属于官方 StandUp 的能力边界。
      front:      {axis: [0.0, 1.0, 0.0], deg: 110.0,  rate: [0.0, 16.0, 0.0], clearance_m: 0.30}
      back:       {axis: [0.0, 1.0, 0.0], deg: -110.0, rate: [0.0, -16.0, 0.0], clearance_m: 0.10}
      side_left:  {axis: [1.0, 0.0, 0.0], deg: 100.0,  rate: [22.0, 0.0, 0.0], clearance_m: 0.15}
      side_right: {axis: [1.0, 0.0, 0.0], deg: -100.0, rate: [-22.0, 0.0, 0.0], clearance_m: 0.15}
      prone:      {axis: [1.0, 0.0, 0.0], deg: 0.0,    rate: [0.0, 0.0, 0.0], clearance_m: 0.005}

fsm:
  # 判定前的本体状态：静态翻倒注入场景下机器人已处于失控/阻尼，
  # S0 保持阻尼（不能 PD 硬撑站立姿态，否则会把机体推过头翻成仰面）
  monitor_mode: damping

  # S1 安全阻尼：最短 0.5 s，最多等 settle_max_s；关节与机体都静止并持续 0.3 s 才算稳。
  # 全翻能量大、落地弹跳多，profiles.full_flip 会把上限覆盖为 5 s。
  settle_min_s: 0.50
  settle_max_s: 3.00
  settle_omega_rad_s: 0.15
  settle_omega_body_rad_s: 0.15
  quiet_sustain_s: 0.30

  # S2 姿态评估与分流（全部复用官方状态：JointDamping / LieDown / StandUp）
  assess_prone_deg: 35.0          # |roll|<35° 且 |pitch|<35° 视为机身已趴平
  assess_supine_roll_deg: 120.0   # |roll|>=120° 视为仰翻（四脚朝天，不可恢复 -> SAFE_FAULT）
  assess_supine_pitch_deg: 80.0   # |pitch|>=80° 视为倒立/仰翻（不可恢复 -> SAFE_FAULT）
  assess_joint_tol_rad: 0.35      # 趴平时四腿偏离 Q_PRE >=0.35 rad 则先调官方 LieDown 整姿
  # 两个时长必须与 sim.stand.duration_per_phase_s 一致；doggie.config 在加载时校验。
  liedown_traj_s: 1.5             # = duration_per_phase_s
  liedown_settle_s: 0.3           # 收腿后阻尼贴地稳定时间

  # S3 仿真轨迹：3 s（1.5 s+1.5 s），与官方参数默认时长一致
  standup_traj_s: 3.0             # = 2 × duration_per_phase_s
  standup_timeout_s: 20.0

  # 重试策略：最多 2 次，间隔 2 s，失败后人工复位
  max_attempts: 2
  backoff_s: 2.0

  # S4 起身后验证：连续直立 1 s；5 s 内未达成算失败
  verify_s: 1.0
  verify_timeout_s: 5.0
  upright_roll_deg: 10.0
  upright_pitch_deg: 10.0
  upright_height_m: 0.25

  # 防反复触发
  max_recoveries_per_min: 3
  require_manual_reset: true

  # 预留：恢复摔倒前的速度指令（当前 FSM 尚未实现，默认关闭）
  resume:
    enabled: false
    ramp_s: 1.0

sim:
  timestep_s: 0.001
  damping_kd: 2.5
  # 主路径恢复为原来的 65–90° 摔倒场景；full_flip 仅作为附加实验 profile。
  fall_profile: nominal
  # 官方 lite3_control_parameters.cpp + standup_state.hpp 参数
  stand:
    pre_height_m: 0.12             # 预站立蹲姿高度（StandUp 第一阶段终点）
    stand_height_m: 0.33           # 站立高度（StandUp 第二阶段终点）
    # 官方 StandUpState 默认每阶段 1.5 s；仿真按相同时间参数复刻轨迹结构
    duration_per_phase_s: 1.5
    kp: 100.0
    kd: 2.5
    # 预站立姿态（每条腿 [HipX, HipY, Knee]）；同时用于翻倒注入与 FSM 整姿判定。
    pre_pose_rad: [0.0, -1.35453, 2.54948]
  trot:
    # 官方 ONNX 策略按 12 个仿真步决策一次；cmd_vel 为归一化指令 [-1, 1]，
    # 实际速度上限 = 归一化值 × 下列上限。
    policy_decimation: 12
    vx_max_m_s: 0.8
    vy_max_m_s: 0.8
    wz_max_rad_s: 0.8
  challenge:
    trip_vx: 0.75                 # 路沿绊倒场景的小跑前进指令（归一化）
  # RL 安全限幅：只在检测到与场景障碍接触时短期启用，不改变正常平地步态。
  rl_guard:
    enabled: true
    smooth_alpha: 0.35            # 策略目标一阶低通系数（1.0=不启用平滑）
    vel_clip_rad_s: 10.0          # 碰撞瞬间送入策略的角速度限幅
    kd: 2.0                       # 碰撞窗口内的关节阻尼增益（正常为 1.0）
    hold_s: 0.40                  # 最后一次接触后继续保持限幅的时间

# 通信/阻尼看门狗参数：当前仿真路径不读取，接入 ROS2 后端后由 SafetyMonitor 使用。
safety:
  backend_heartbeat_timeout_s: 0.50
  damping_ack_timeout_s: 0.50
  estop_on_comm_loss: true
  fault_hold_s: 2.0             # 故障后保持阻尼的观察窗口（实机常驻模式退出前）
  allow_real_fall_test: false   # 实机禁止自由摔倒；只允许受控倾斜

# 实机 ROS2 后端（scripts/run_real.py）。话题/字段差异见 docs/09-real-machine.md
ros2:
  node_name: doggie_recovery
  # 传感器（默认按官方 drdds 消息；若实际驱动用 sensor_msgs/Imu 请改 imu_type）
  imu_topic: /IMU_DATA
  imu_type: drdds/msg/ImuData
  imu_rpy_in_degrees: true
  joints_topic: /JOINTS_DATA
  joints_type: drdds/msg/JointsData
  # 消息里 12 个关节的排列顺序（按实际 /JOINTS_DATA 核对！）
  joint_order: [FL_HipX_joint, FL_HipY_joint, FL_Knee_joint,
                FR_HipX_joint, FR_HipY_joint, FR_Knee_joint,
                HL_HipX_joint, HL_HipY_joint, HL_Knee_joint,
                HR_HipX_joint, HR_HipY_joint, HR_Knee_joint]
  # 控制：官方状态机切换话题。留空 = 只读干跑，不下发任何运动指令
  state_cmd_topic: ""
  state_cmd_type: std_msgs/msg/String
  state_names:
    damping: kJointDamping
    liedown: kLieDown
    standup: kStandUp
    hold: kIdle
    rl: kRLControl
  state_feedback_topic: ""      # 官方状态回读；留空则阻尼确认不可观测（看门狗不误报）
  state_feedback_type: std_msgs/msg/String  # 回读消息类型；若官方用自定义 State 消息请改
  estop_topic: ""               # 独立急停话题（std_msgs/Bool）
  status_topic: /doggie/status
  reset_service: /doggie/reset
  recover_service: /doggie/recover  # 人工触发当前姿态的恢复流程；留空则关闭
  cmd_resend_s: 0.20            # 模式指令重发周期
  height_source: fk             # fk=关节正解估计；msg=消息自带高度字段
  force_threshold_n: 15.0       # 足端法向力 > 15 N 计为触地

logging:
  rate_hz: 100                   # 时间序列记录频率（Supervisor 按此调度）
  root: "data/raw"
  save_timeseries: true
  save_video: true
