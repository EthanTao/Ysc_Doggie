# Doggie 恢复运控参数（唯一参数源）
# 说明：
#   1. 下列阈值均为待标定初值，最终值以 data/calibration/thresholds.md 为准。
#   2. 代码中禁止散落魔法数字；实验记录配置哈希，保证可复现。
#   3. 角度单位为度，时间单位为秒，角速度单位为 rad/s。

meta:
  version: "0.1.0"
  updated: "2026-11-19"
  robot: "DeepRobotics Lite3 (no LiDAR)"

detector:
  rate_hz: 200
  lowpass_cutoff_hz: 10.0

  # 主判据：姿态角门限
  roll_threshold_deg: 50.0
  pitch_threshold_deg: 50.0

  # 快速通道：大倾角短驻留，保证时延 <= 2 s
  fast_path_deg: 75.0
  fast_path_dwell_s: 0.15

  # 持续确认：抑制腾空/急转瞬间误报
  dwell_s: 0.30

  # 回差：起身过程中姿态在阈值附近抖动时不重复触发
  recover_roll_deg: 35.0
  recover_pitch_deg: 35.0
  recover_dwell_s: 0.50

  # 辅助判据
  quiet_omega_rad_s: 1.5
  min_height_m: 0.20          # 仅仿真使用
  use_height: true
  use_contact: true
  contact_min_feet: 1
  nan_timeout_s: 0.20

  # 翻倒类型分类（仅用于记录/策略，不参与是否摔倒的判定）
  fall_type_pitch_deg: 60.0
  fall_type_roll_deg: 60.0

fsm:
  # S1 安全阻尼：最短 0.5 s，最多等 3 s（平台阻尼 3 s 后回 Idle）
  settle_min_s: 0.50
  settle_max_s: 3.00
  settle_omega_rad_s: 0.50

  # S3 起身：单次 20 s 超时；5 s 无改善可早停
  standup_timeout_s: 20.0
  standup_progress_window_s: 5.0
  standup_progress_min_deg: 5.0

  # 重试策略：最多 2 次，间隔 2 s，失败后人工复位
  max_attempts: 2
  backoff_s: 2.0

  # S4 起身后验证
  verify_s: 1.0
  upright_roll_deg: 10.0
  upright_pitch_deg: 10.0
  upright_height_m: 0.25
  upright_height_tol_m: 0.03

  # 防反复触发
  max_recoveries_per_min: 3
  require_manual_reset: true

  # 可选：恢复摔倒前的速度指令（默认关闭，演示场景二可开启）
  resume:
    enabled: false
    ramp_s: 1.0

sim:
  timestep_s: 0.001
  # 官方 lite3_control_parameters.cpp + standup_state.hpp 参数
  stand:
    pre_height_m: 0.12
    stand_height_m: 0.33
    duration_per_phase_s: 2.0
    kp: 100.0
    kd: 2.5
    pre_pose_rad: [0.0, -1.35453, 2.54948]   # 每腿 [HipX, HipY, Knee]
  trot:
    policy_decimation: 12
    vx_max_m_s: 0.8
    wz_max_rad_s: 0.8

safety:
  backend_heartbeat_timeout_s: 0.50
  damping_ack_timeout_s: 0.50
  estop_on_comm_loss: true
  allow_real_fall_test: false   # 实机禁止自由摔倒；只允许受控倾斜

logging:
  rate_hz: 100
  root: "data/raw"
  save_timeseries: true
  save_video: true
