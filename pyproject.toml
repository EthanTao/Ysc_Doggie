[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doggie"
version = "0.1.0"
description = "Lite3 fall detection and recovery state machine (course task 2)"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24,<3",
    "mujoco>=3.1",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "Pillow>=10",
]
video = [
    "imageio[ffmpeg]>=2.31",
]
rl = [
    "onnxruntime>=1.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --disable-plugin-autoload"

[tool.ruff]
line-length = 100
target-version = "py39"
